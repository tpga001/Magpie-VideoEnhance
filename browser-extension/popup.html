<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magpie 视频增强</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div class="heading">
      <div>
        <h1>视频增强</h1>
        <p id="status">读取状态…</p>
      </div>
      <label class="switch" aria-label="开启视频增强">
        <input id="enabled" type="checkbox">
        <span></span>
      </label>
    </div>
    <p class="hint">开启后自动处理前台主视频，并在下次启动浏览器时保持开启。超分和补帧使用 Magpie 当前浏览器模式；关闭扩展开关后不会自行重启。</p>
    <p id="error" class="error" hidden></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
